databases:
  - name: drone_db
    plan: free

services:
  - type: web
    name: cyberpunk-drone-c2
    env: ruby
    buildCommand: bundle install && bundle exec sequel -m db/migrations "$DATABASE_URL"
    startCommand: bundle exec rackup config.ru -p $PORT -o 0.0.0.0 -s puma
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drone_db
          property: connectionString
      - key: RACK_ENV
        value: production
